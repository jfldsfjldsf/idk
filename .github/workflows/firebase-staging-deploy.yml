# .github/workflows/firebase-staging-deploy.yml

name: Deploy to STAGING Firebase Hosting (cherri-ontop)

on:
  push:
    branches:
      # CRITICAL CHANGE 1: Use your confirmed branch name
      - master 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to STAGING Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          # CRITICAL CHANGE 2: Use the secret you created for the new project
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' 
          channelId: live
          # CRITICAL CHANGE 3: Use your confirmed Project ID
          projectId: cherri-ontop
