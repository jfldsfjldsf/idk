name: Deploy to Firebase Hosting (Master)

on:
  push:
    # Trigger deployment only on pushes to the 'master' branch
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # IMPORTANT: If your project needs a build step (e.g., React, Vue, Angular)
      # UNCOMMENT and adjust the 'run' command below.
      # - name: Install Dependencies and Build
      #   run: |
      #     npm ci
      #     npm run build 

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # --- KEY CHANGE: Using your secret name: FIREBASE2 ---
          firebaseServiceAccount: ${{ secrets.FIREBASE2 }}
          
          # --- KEY CHANGE: Your specified Project ID: use-cherri ---
          projectId: use-cherri 
          
          channelId: live
