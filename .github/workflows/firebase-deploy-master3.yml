name: Deploy to Firebase Hosting (Live)

on:
  push:
    # Trigger deployment only on pushes to the 'master' branch
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # IMPORTANT: If your project is a modern framework (React, Vue, etc.),
      # you MUST UNCOMMENT and adjust the build step below.
      # - name: Install Dependencies and Build
      #   run: |
      #     npm ci
      #     npm run build 

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # --- KEY CHANGE: Using your secret name: katy ---
          firebaseServiceAccount: ${{ secrets.katy }}
          
          # --- KEY CHANGE: Your specified Project ID: cherri-katyisd ---
          projectId: cherri-katyisd 
          
          # Deploy to the live production channel
          channelId: live
